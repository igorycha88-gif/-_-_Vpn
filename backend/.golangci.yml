version: "2"

run:
  timeout: 5m

linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - encoding/json.Encoder.Encode
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA5011"
