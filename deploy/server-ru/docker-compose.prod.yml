services:
  nginx:
    image: nginx:1.27-alpine
    container_name: smarttraffic-nginx
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "api:host-gateway"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - certbot-data:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
      landing:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  certbot:
    image: certbot/certbot:latest
    container_name: smarttraffic-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/igorycha88-gif/smarttraffic}/api:${IMAGE_TAG:-latest}
    container_name: smarttraffic-api
    environment:
      - APP_PORT=8080
      - DB_PATH=/data/smarttraffic.db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-168h}
      - VLESS_PRIVATE_KEY=${VLESS_PRIVATE_KEY:-}
      - VLESS_PUBLIC_KEY=${VLESS_PUBLIC_KEY:-}
      - VLESS_SHORT_ID=${VLESS_SHORT_ID:-}
      - VLESS_SERVER_NAME=${VLESS_SERVER_NAME:-www.microsoft.com}
      - VLESS_PORT=${VLESS_PORT:-8443}
      - VLESS_FLOW=${VLESS_FLOW:-xtls-rprx-vision}
      - VLESS_FINGERPRINT=${VLESS_FINGERPRINT:-chrome}
      - VLESS_SERVER_ENDPOINT=${VLESS_SERVER_ENDPOINT:-}
      - HY2_ENABLED=${HY2_ENABLED:-false}
      - HY2_SERVER=${HY2_SERVER:-}
      - HY2_PORT=${HY2_PORT:-8444}
      - HY2_PASSWORD=${HY2_PASSWORD:-}
      - HY2_SERVER_NAME=${HY2_SERVER_NAME:-www.bing.com}
      - WG_TUNNEL_INTERFACE=${WG_TUNNEL_INTERFACE:-wg1}
      - SINGBOX_CONFIG_PATH=/etc/singbox/config.json
      - SINGBOX_CLASH_API_ADDR=${SINGBOX_CLASH_API_ADDR:-127.0.0.1:9090}
      - SINGBOX_CLASH_API_SECRET=${SINGBOX_CLASH_API_SECRET:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN}}
      - FOREIGN_SERVER_IP=${FOREIGN_SERVER_IP:-}
      - FOREIGN_TUNNEL_PRIVATE_KEY=${FOREIGN_TUNNEL_PRIVATE_KEY:-}
      - FOREIGN_TUNNEL_PEER_PUBLIC_KEY=${FOREIGN_TUNNEL_PEER_PUBLIC_KEY:-}
      - FOREIGN_TUNNEL_LOCAL_ADDRESS=${FOREIGN_TUNNEL_LOCAL_ADDRESS:-10.20.0.2/30}
      - FOREIGN_VLESS_UUID=${FOREIGN_VLESS_UUID:-}
      - FOREIGN_VLESS_REALITY_PUBLIC_KEY=${FOREIGN_VLESS_REALITY_PUBLIC_KEY:-}
      - FOREIGN_VLESS_REALITY_SHORT_ID=${FOREIGN_VLESS_REALITY_SHORT_ID:-}
      - FOREIGN_VLESS_SERVER_NAME=${FOREIGN_VLESS_SERVER_NAME:-www.microsoft.com}
      - FOREIGN_VLESS_PORT=${FOREIGN_VLESS_PORT:-443}
    volumes:
      - api-data:/data
      - ./singbox:/etc/singbox
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  singbox:
    image: ghcr.io/sagernet/sing-box:v1.13.12@sha256:da0e2331395c9025a85fa58892772b4cdbe5f2e530e93defeec3968175d06c6d
    container_name: smarttraffic-singbox
    working_dir: /etc/singbox
    environment:
      - ENABLE_DEPRECATED_OUTBOUND_DNS_RULE_ITEM=true
    entrypoint: ["/bin/sh", "-c", "if [ ! -f geoip.db ] || [ ! -s geoip.db ]; then echo 'WARNING: geoip.db missing, downloading...'; wget -q -O geoip.db https://github.com/SagerNet/sing-geoip/releases/latest/download/geoip.db || echo 'FAIL: geoip.db download failed - geoip routing will not work'; fi; if [ ! -f geosite.db ] || [ ! -s geosite.db ]; then echo 'WARNING: geosite.db missing, downloading...'; wget -q -O geosite.db https://github.com/SagerNet/sing-geosite/releases/latest/download/geosite.db || echo 'FAIL: geosite.db download failed'; fi; exec sing-box run -c /etc/singbox/config.json"]
    volumes:
      - ./singbox:/etc/singbox
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/igorycha88-gif/smarttraffic}/frontend:${IMAGE_TAG:-latest}
    container_name: smarttraffic-frontend
    environment:
      - VITE_API_URL=https://${DOMAIN}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  landing:
    image: ${IMAGE_PREFIX:-ghcr.io/igorycha88-gif/smarttraffic}/landing:${IMAGE_TAG:-latest}
    container_name: smarttraffic-landing
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

volumes:
  certbot-data:
  api-data:
