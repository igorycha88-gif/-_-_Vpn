services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarttraffic-api
    environment:
      - APP_PORT=8080
      - DB_PATH=/data/smarttraffic.db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-168h}
      - VLESS_PRIVATE_KEY=${VLESS_PRIVATE_KEY:-}
      - VLESS_PUBLIC_KEY=${VLESS_PUBLIC_KEY:-}
      - VLESS_SHORT_ID=${VLESS_SHORT_ID:-}
      - VLESS_SERVER_NAME=${VLESS_SERVER_NAME:-www.microsoft.com}
      - VLESS_PORT=${VLESS_PORT:-8443}
      - VLESS_FLOW=${VLESS_FLOW:-xtls-rprx-vision}
      - VLESS_FINGERPRINT=${VLESS_FINGERPRINT:-chrome}
      - VLESS_SERVER_ENDPOINT=${VLESS_SERVER_ENDPOINT:-}
      - HY2_ENABLED=${HY2_ENABLED:-false}
      - HY2_SERVER=${HY2_SERVER:-}
      - HY2_PORT=${HY2_PORT:-8444}
      - HY2_PASSWORD=${HY2_PASSWORD:-}
      - HY2_SERVER_NAME=${HY2_SERVER_NAME:-www.bing.com}
      - WG_TUNNEL_INTERFACE=${WG_TUNNEL_INTERFACE:-wg1}
      - SINGBOX_CONFIG_PATH=/etc/singbox/config.json
      - SINGBOX_CLASH_API_ADDR=${SINGBOX_CLASH_API_ADDR:-127.0.0.1:9090}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - FOREIGN_SERVER_IP=${FOREIGN_SERVER_IP:-}
      - FOREIGN_TUNNEL_PRIVATE_KEY=${FOREIGN_TUNNEL_PRIVATE_KEY:-}
      - FOREIGN_TUNNEL_PEER_PUBLIC_KEY=${FOREIGN_TUNNEL_PEER_PUBLIC_KEY:-}
      - FOREIGN_TUNNEL_LOCAL_ADDRESS=${FOREIGN_TUNNEL_LOCAL_ADDRESS:-10.20.0.2/30}
    volumes:
      - api-data:/data
      - ./deploy/server-ru/singbox:/etc/singbox
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarttraffic-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: smarttraffic-landing
    ports:
      - "8081:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  nginx:
    image: nginx:1.27-alpine
    container_name: smarttraffic-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/server-ru/nginx/conf.d/local.conf.disabled:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
      - landing
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  singbox:
    image: ghcr.io/sagernet/sing-box:v1.13.12@sha256:da0e2331395c9025a85fa58892772b4cdbe5f2e530e93defeec3968175d06c6d
    container_name: smarttraffic-singbox
    volumes:
      - ./deploy/server-ru/singbox:/etc/singbox
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    profiles:
      - routing

volumes:
  certbot-data:
  api-data:
